  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    :root {
      --primary: #00A0E9;
      --primary-dark: #0088cc;
      --bg: #f2f2f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #8e8e93;
      --border: #e5e5ea;
      --green: #34c759;
      --amber: #ff9500;
      --red: #ff3b30;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
    }
    .header {
      background: var(--primary);
      color: white;
      text-align: center;
      padding: 14px 16px 12px;
      font-size: 1.1rem;
      font-weight: 600;
      flex-shrink: 0;
      letter-spacing: 1px;
    }
    .search-box {
      background: white;
      padding: 12px 16px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }
    .search-input {
      width: 100%;
      padding: 12px 14px;
      font-size: 1.2rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: #fafafa;
      font-family: inherit;
      letter-spacing: 1px;
      text-align: center;
      font-weight: 600;
    }
    .search-input:focus { border-color: var(--primary); background: white; }
    .search-input::placeholder { color: #c7c7cc; font-weight: 400; letter-spacing: 0; }
    .results {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: white;
    }
    .result-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      gap: 12px;
      transition: background 0.1s;
    }
    .result-item:active { background: #f2f2f7; }
    .result-num {
      font-size: 1.5rem;
      font-weight: 700;
      min-width: 64px;
      text-align: center;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }
    .plate-kmb { background: #E4002B; color: #fff; }
    .plate-lwb { background: #FF6200; color: #fff; }
    .plate-ctb { background: #FFD100; color: #1a1a1a; }
    .plate-nlb { background: #007A3D; color: #fff; }
    .plate-gmb { background: #00A651; color: #fff; }
    .plate-gmb-hki { background: #5AC8FA; color: #1a1a1a; }
    .plate-gmb-kln { background: #39FF14; color: #1a1a1a; }
    .plate-gmb-nt  { background: #C5A3FF; color: #1a1a1a; }
    .plate-mtrbus { background: #0077C8; color: #fff; }
    .result-info { flex: 1; min-width: 0; }
    .result-dest {
      font-size: 0.98rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .result-co {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .result-arrow {
      color: #c7c7cc;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .empty-state, .loading-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .keypad {
      flex-shrink: 0;
      background: #1565C0;
      padding: 8px 6px 6px;
      user-select: none;
    }
    .weather-bar {
      flex-shrink: 0;
      background: #1c1c1e;
      color: #f2f2f7;
      padding: 8px 12px 10px;
      font-size: 0.78rem;
      border-top: 1px solid #3a3a3c;
    }
    .weather-main {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .weather-icon {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      object-fit: contain;
    }
    .weather-temp {
      font-size: 1.35rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .weather-meta {
      flex: 1;
      min-width: 0;
      line-height: 1.35;
    }
    .weather-meta .wx-line {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #aeaeb2;
    }
    .weather-meta .wx-line strong {
      color: #f2f2f7;
      font-weight: 600;
    }
    .weather-warns {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }
    .wx-warn-badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      background: #ff3b30;
      color: #fff;
    }
    .wx-warn-badge.yellow { background: #ffcc00; color: #1a1a1a; }
    .wx-warn-badge.amber { background: #ff9500; color: #1a1a1a; }
    .wx-warn-badge.red { background: #ff3b30; color: #fff; }
    .wx-warn-badge.black { background: #1c1c1e; color: #fff; border: 1px solid #aeaeb2; }
    .wx-warn-badge.blue { background: #007aff; color: #fff; }
    .wx-forecast {
      margin-top: 5px;
      color: #8e8e93;
      font-size: 0.72rem;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .weather-bar.wx-loading { color: #8e8e93; text-align: center; padding: 12px; }
    .bus-ticker {
      flex-shrink: 0;
      height: 48px;
      background: linear-gradient(90deg, #e3f2fd 0%, #bbdefb 50%, #e3f2fd 100%);
      overflow: hidden;
      position: relative;
      border-top: 1px solid #90caf9;
    }
    .bus-ticker-track {
      position: absolute;
      top: 4px;
      left: 0;
      height: 40px;
      width: 200%;
      animation: bus-move 18s linear infinite;
      display: flex;
      align-items: center;
    }
    .bus-ticker img {
      height: 40px;
      width: auto;
      margin-right: 80vw;
      filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.25));
    }
    @keyframes bus-move {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .eta-fare-box {
      margin: 8px 12px 4px;
      padding: 10px 12px;
      background: #f8f9fa;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 0.82rem;
    }
    .eta-fare-title {
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
      font-size: 0.85rem;
    }
    .eta-fare-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .eta-fare-item {
      flex: 1;
      min-width: 80px;
      text-align: center;
      padding: 6px 4px;
      background: white;
      border-radius: 8px;
      border: 1px solid #e5e5ea;
    }
    .eta-fare-item .label {
      display: block;
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .eta-fare-item .price {
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .eta-fare-item.joyyou .price { color: #e65100; }
    .eta-fare-note {
      margin-top: 6px;
      font-size: 0.68rem;
      color: var(--muted);
      line-height: 1.3;
    }

    .key-row {
      display: flex;
      gap: 5px;
      margin-bottom: 5px;
      justify-content: center;
    }
    .key-row:last-child { margin-bottom: 0; }
    .key {
      flex: 1;
      max-width: 72px;
      height: 46px;
      border: none;
      border-radius: 8px;
      background: white;
      font-size: 1.35rem;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      transition: background 0.08s, transform 0.05s;
    }
    .key:active {
      background: #d1d1d6;
      transform: scale(0.96);
    }
    .key-letter {

      color: #1c1c1e;
      flex: 0 0 42px;

    .key-letter:active { background: #b0b6bc; }
    .key-func {
      background: #8e99a4;
      color: white;

    .key-func:active { background: #6d7883; }
    .keypad-main {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .num-pad {

      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .letter-pad {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .page { display: none; flex-direction: column; height: 100%; }
    .page.active { display: flex; }
    .page-header {
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      padding: 12px 8px;
      flex-shrink: 0;
      gap: 4px;
    }
    .back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.4rem;
      padding: 4px 10px;
      cursor: pointer;
      line-height: 1;
    }
    .page-title {

      text-align: center;
      font-size: 1.05rem;
      font-weight: 600;
      margin-right: 36px;
    }
    .stop-list, .eta-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: white;
      min-height: 0;
    }
    .stops-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
    }
    .map-wrap {
      height: 42%;
      min-height: 180px;
      max-height: 320px;
      position: relative;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: #e8eef3;
    }
    .map-wrap.collapsed { height: 0; min-height: 0; max-height: 0; border: none; overflow: hidden; }
    #routeMap, #etaMap { width: 100%; height: 100%; z-index: 1; }
    .eta-map-wrap {
      height: 36%;
      min-height: 160px;
      max-height: 280px;
      position: relative;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: #e8eef3;
    }
    .map-dir-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 1000;
      background: rgba(28,28,30,.88);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 8px;
      max-width: 70%;
      pointer-events: none;
    }
    .map-controls {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .map-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: none;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .map-btn:active { background: #f0f0f0; }
    .map-btn.active { background: var(--primary); color: white; }
    .map-toggle-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: #f8f8f8;
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
      flex-shrink: 0;
    }
    .map-toggle-bar button {
      border: none;
      background: none;
      color: var(--primary);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
    }
    .stop-item-wrap {
      border-bottom: 1px solid var(--border);
      background: white;
    }
    .stop-item {
      padding: 14px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .stop-item:active { background: #f2f2f7; }
    .stop-item-wrap.nearest .stop-item { background: #e8f6ff; }
    .stop-item-wrap.selected-stop .stop-item { background: #d6f0ff; }
    .stop-item-wrap.selected-stop {
      box-shadow: inset 3px 0 0 var(--primary);
    }
    .stop-seq {
      font-size: 0.85rem;
      color: var(--muted);
      min-width: 28px;
      font-weight: 600;
    }
    .stop-name { font-size: 0.98rem; font-weight: 500; flex: 1; }
    .stop-dist {
      font-size: 0.72rem;
      color: var(--primary);
      font-weight: 600;
      white-space: nowrap;
    }
    .stop-inline-eta {
      padding: 0 16px 12px 56px;
      display: none;
    }
    .stop-item-wrap.selected-stop .stop-inline-eta { display: block; }
    .inline-eta-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 4px 0;
    }
    .inline-eta-mins {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--green);
      min-width: 4.5em;
      font-variant-numeric: tabular-nums;
    }
    .inline-eta-mins.soon { color: var(--green); }
    .inline-eta-mins.arrived { color: var(--green); }
    .inline-eta-time {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--green);
      font-variant-numeric: tabular-nums;
    }
    .inline-eta-rmk {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .inline-eta-actions {
      margin-top: 6px;
      display: flex;
      gap: 8px;
    }
    .inline-eta-actions button {
      border: none;
      background: #f2f2f7;
      color: var(--primary);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .inline-eta-loading, .inline-eta-empty {
      font-size: 0.82rem;
      color: var(--muted);
      padding: 4px 0 2px;
    }
    .leaflet-container { font: inherit; background: #e8eef3; }
    .stop-marker-icon {
      background: #00A0E9;
      color: #fff;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
    }
    .stop-marker-icon.active {
      background: #ff3b30;
      width: 30px;
      height: 30px;
      font-size: 12px;
    }
    .eta-header-info {
      background: #1c1c1e;
      color: white;
      padding: 16px;
    }
    .eta-route-num {
      font-size: 2.1rem;
      font-weight: 700;
      display: inline-block;
      padding: 4px 14px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }
    .eta-dest-text { font-size: 0.95rem; color: #aeaeb2; margin-top: 4px; }
    .eta-stop-text { font-size: 0.9rem; margin-top: 8px; }
    .eta-co-badge {
      display: inline-block;
      background: #3a3a3c;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 0.72rem;
      margin-top: 6px;
    }
    .eta-rows { padding: 8px 0; }
    .eta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .eta-mins {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--green);
      font-variant-numeric: tabular-nums;
    }
    .eta-mins.soon { color: var(--green); }
    .eta-mins.arrived { color: var(--green); }
    .eta-time-pair { display: flex; flex-direction: column; gap: 2px; align-items: flex-end; }
    .eta-time-label { font-size: 0.68rem; color: var(--muted); }
    .eta-clock {
      font-size: 1.05rem;
      color: var(--green);
      font-weight: 600;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .eta-rmk {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .eta-toolbar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: white;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .eta-btn {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: #f2f2f7;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .eta-btn:active { background: #e5e5ea; }
    .eta-btn.active-refresh {
      background: var(--primary);
      color: white;
    }
    .eta-refresh-info {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      padding: 6px 16px 10px;
      background: white;
    }
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px 6px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.5px;
      background: #fafafa;
      border-bottom: 1px solid var(--border);
    }
    .section-title .clear-link {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      padding: 2px 4px;
    }
    .fav-btn {
      background: none;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
      padding: 4px 6px;
      line-height: 1;
      flex-shrink: 0;
      color: #c7c7cc;
      transition: color 0.15s, transform 0.1s;
    }
    .fav-btn.on { color: #ff9500; }
    .fav-btn:active { transform: scale(0.9); }
    .result-item .fav-btn { margin-left: auto; }
    .home-hint {
      text-align: center;
      padding: 28px 20px 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .page-header .fav-btn {
      color: rgba(255,255,255,0.7);
      font-size: 1.3rem;
      margin-right: 4px;
    }
    .page-header .fav-btn.on { color: #ffd60a; }
    .no-eta {
      text-align: center;
      padding: 30px 16px;
      color: var(--muted);
      font-size: 0.95rem;
    }

  <script>
    const CO_NAMES = {
      kmb: '九巴', lwb: '龍運巴士', ctb: '城巴', nlb: '嶼巴',
      gmb: '專線小巴', mtrbus: '港鐵巴士'
    };

    // ——— 車費資料（hkbus routeFareList）———
    let _fareRouteList = null;
    let _fareLoading = null;
    async function ensureFareData() {
      if (_fareRouteList) return _fareRouteList;
      if (_fareLoading) return _fareLoading;
      _fareLoading = (async () => {
        try {
          const res = await fetch('https://data.hkbus.app/routeFareList.min.json', { cache: 'force-cache' });
          const json = await res.json();
          _fareRouteList = json.routeList || {};
          return _fareRouteList;
        } catch (e) {
          console.warn('fare data load failed', e);
          _fareRouteList = {};
          return _fareRouteList;
        } finally {
          _fareLoading = null;
        }
      })();
      return _fareLoading;
    }

    function roundFare(n) {
      // 四捨五入至最接近一毫
      return Math.round(n * 10) / 10;
    }

    function formatHKD(n) {
      if (n == null || isNaN(n)) return '—';
      const v = roundFare(Number(n));
      return '$' + (Number.isInteger(v) ? v.toFixed(0) : v.toFixed(1));
    }

    function isAirportRoute(route) {
      const r = String(route || '').toUpperCase().trim();
      return /^A\d/.test(r) || /^NA\d/.test(r);
    }

    function computeJoyYou(adult, route) {
      if (adult == null || isNaN(adult)) return null;
      const a = Number(adult);
      if (isAirportRoute(route)) {
        // A / NA 線不納入政府「兩蚊兩折」，按巴士公司半價優惠（小童／長者半價）
        return roundFare(a / 2);
      }
      // 政府兩蚊兩折：≤$10 → $2；>$10 → 兩折（至最接近一毫）
      if (a <= 10) return Math.min(a, 2);
      return roundFare(a * 0.2);
    }

    function computeChild(adult) {
      if (adult == null || isNaN(adult)) return null;
      return roundFare(Number(adult) / 2);
    }

    async function resolveFullFare(co, route, bound, destLabel) {
      const list = await ensureFareData();
      if (!list || !Object.keys(list).length) return null;
      const coKey = (co === 'lwb') ? 'lwb' : (co || '').toLowerCase();
      const routeStr = String(route || '');
      // 嘗試匹配 routeList key：route+service+orig+dest
      let best = null;
      let bestScore = -1;
      for (const [key, info] of Object.entries(list)) {
        if (!key.startsWith(routeStr + '+')) continue;
        const cos = (info.co || []).map(c => String(c).toLowerCase());
        if (coKey && !cos.includes(coKey) && !(coKey === 'kmb' && cos.includes('lwb'))) {
          // 仍允許同號碼其他公司作後備
        }
        const fares = info.fares;
        if (!fares || !fares.length) continue;
        const full = Math.max(...fares.map(f => parseFloat(f)).filter(x => !isNaN(x)));
        if (!full) continue;
        let score = 0;
        if (cos.includes(coKey)) score += 5;
        if (destLabel && info.dest) {
          const dz = (info.dest.zh || '') + (info.dest.en || '');
          if (destLabel && dz.includes(String(destLabel).slice(0, 4))) score += 3;
        }
        if (bound && info.bound) {
          const bmap = info.bound[coKey] || info.bound[cos[0]];
          if (bmap) {
            const want = bound === 'in' ? 'I' : 'O';
            if (String(bmap).toUpperCase().startsWith(want)) score += 2;
          }
        }
        if (score > bestScore) {
          bestScore = score;
          best = full;
        }
      }
      return best;
    }

    async function updateFareDisplay() {
      const box = document.getElementById('etaFareBox');
      if (!box) return;
      const adultEl = document.getElementById('fareAdult');
      const childEl = document.getElementById('fareChild');
      const joyEl = document.getElementById('fareJoyYou');
      const noteEl = document.getElementById('fareNote');
      adultEl.textContent = '…';
      childEl.textContent = '…';
      joyEl.textContent = '…';
      noteEl.textContent = '';
      box.style.display = 'block';

      const full = await resolveFullFare(
        state.co,
        state.route,
        state.bound,
        state.directionLabel
      );
      if (full == null) {
        adultEl.textContent = '—';
        childEl.textContent = '—';
        joyEl.textContent = '—';
        noteEl.textContent = '暫無此路線全程車費資料（可能為分段收費或資料未更新）';
        return;
      }
      const child = computeChild(full);
      const joy = computeJoyYou(full, state.route);
      adultEl.textContent = formatHKD(full);
      childEl.textContent = formatHKD(child);
      joyEl.textContent = formatHKD(joy);
      if (isAirportRoute(state.route)) {
        noteEl.textContent = 'A／NA 線不適用政府「兩蚊兩折」；樂悠咭按巴士公司半價優惠計算。實際車費以車長／八達通為準，可能因分段而異。';
      } else {
        noteEl.textContent = '樂悠咭按政府「兩蚊兩折」：全程 ≤$10 收 $2，>$10 收兩折。實際車費以車長／八達通為準，可能因分段而異。';
      }
    }


    function plateClass(item) {
      if (item.co === 'gmb' && item.region) {
        const r = (item.region || '').toUpperCase();
        if (r === 'HKI') return 'plate-gmb-hki';
        if (r === 'KLN') return 'plate-gmb-kln';
        if (r === 'NT')  return 'plate-gmb-nt';

    async function fetchJSON(url, options = {}, timeoutMs = 12000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { ...options, signal: controller.signal });
        if (!res.ok) {
          const err = new Error(`HTTP ${res.status}`);
          err.status = res.status;
          throw err;
        }
        return await res.json();
      } finally {
        clearTimeout(timer);
      }
    }

    // 龍運巴士路線辨識（KMB API 多數不帶 co 欄位）
    function isLwbRoute(route) {
      const r = String(route || '').toUpperCase();
      // 機場 A 線（龍運營運，不含城巴 A10–A29 等）
      if (/^A(3[0-9]|4[0-9]|5[0-9])/.test(r)) return true;
      // 北大嶼山對外 E 線
      if (/^E(3[1-9]|4[0-9])/.test(r)) return true;
      // 機場穿梭 S 線
      if (/^S(1|64|65)/.test(r)) return true;
      // 通宵機場 NA 線
      if (/^NA(3[0-9]|4[0-9])/.test(r)) return true;
      // 其他龍運：R8、X1 等
      if (r === 'R8' || r === 'X1') return true;
      return false;
    }

    // ========== 路線載入（修正：保留 KMB 雙方向） ==========
    async function loadKmbRoutes() {
      try {
        const json = await fetchJSON('https://data.etabus.gov.hk/v1/transport/kmb/route/');
        if (!json.data) return [];
        const map = new Map();
        json.data.forEach(r => {
          const apiCo = (r.co || '').toLowerCase();
          const co = (apiCo === 'lwb' || isLwbRoute(r.route)) ? 'lwb' : 'kmb';
          const bound = (r.bound === 'I' || r.bound === 'i') ? 'in' : 'out';
          const st = String(r.service_type || '1');
          // 以 route + co + bound + service_type 作為唯一鍵，保留雙方向
          const key = r.route + '_' + co + '_' + bound + '_' + st;
          if (!map.has(key)) {
            map.set(key, {
              route: r.route,
              co,
              bound,
              orig: r.orig_tc || r.orig_en || '',
              dest: r.dest_tc || r.dest_en || '',
              service_type: st
            });
          }
        });
        return Array.from(map.values());
      } catch (e) {
        console.warn('KMB route load failed', e);
        return [];
      }
    }

    async function loadCtbRoutes() {
      try {
        let json;
        try {
          json = await fetchJSON('https://rt.data.gov.hk/v2/transport/citybus/route/CTB');
        } catch {
          json = await fetchJSON('https://rt.data.gov.hk/v1/transport/citybus-nwfb/route/ctb');
        }
        if (!json.data) return [];
        const list = [];
        const seen = new Set();
        json.data.forEach(r => {
          if (seen.has(r.route)) return;
          seen.add(r.route);
          const orig = r.orig_tc || r.orig_en || '';
          const dest = r.dest_tc || r.dest_en || '';
          // 直接產生來回兩個方向，搜尋結果無需再選方向
          list.push({
            route: r.route, co: 'ctb', bound: 'out',
            orig, dest
          });
          if (orig || dest) {
            list.push({
              route: r.route, co: 'ctb', bound: 'in',
              orig: dest, dest: orig
            });
          }
        });
        return list;
      } catch (e) {
        console.warn('CTB route load failed', e);
        return [];
      }
    }

    async function loadMtrBusRoutes() {
      // 優先嘗試線上 CSV（若未來開放 CORS），失敗則用內建清單
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 6000);
        const res = await fetch('https://opendata.mtr.com.hk/data/mtr_bus_routes.csv', { signal: controller.signal });
        clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = (await res.text()).replace(/^\uFEFF/, '');
        const lines = text.trim().split('\n');
        if (lines.length < 2) throw new Error('empty');
        const map = new Map();
        for (let i = 1; i < lines.length; i++) {
          const cols = parseCSVLine(lines[i]);
          if (cols.length < 3) continue;
          const routeId = cols[0].trim();
          const nameChi = cols[1].trim();
          if (!map.has(routeId)) {
            let orig = '', dest = '';
            const parts = nameChi.split('至');
            if (parts.length >= 2) {
              orig = parts[0].trim();
              dest = parts.slice(1).join('至').replace(/\(循環線\)/g, '').trim();
            } else dest = nameChi;
            map.set(routeId, { route: routeId, co: 'mtrbus', orig, dest });
          }
        }
        const list = Array.from(map.values());
        if (list.length > 0) return list;
      } catch (e) {
        console.warn('MTR Bus online load failed, using static list', e);
      }
      return MTR_BUS_STATIC.slice();
    }

    async function loadNlbRoutes() {
      try {
        const json = await fetchJSON('https://rt.data.gov.hk/v2/transport/nlb/route.php?action=list');
        if (!json.routes) return [];
        return json.routes.map(r => {
          const name = r.routeName_c || r.routeName_e || '';
          let orig = '', dest = '';
          const parts = name.split(/\s*>\s*/);
          if (parts.length >= 2) {
            orig = parts[0].trim();
            dest = parts[1].trim();
          } else {
            dest = name;
          }
          return {
            route: r.routeNo,
            co: 'nlb',
            orig,
            dest,
            nlbRouteId: r.routeId
          };
        });
      } catch (e) {
        console.warn('NLB route load failed', e);
        return [];
      }
    }

    function parseCSVLine(line) {
      const result = [];
      let current = '', inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') inQuotes = !inQuotes;
        else if (c === ',' && !inQuotes) { result.push(current); current = ''; }
        else current += c;
      }
      result.push(current);
      return result;
    }

    async function loadAllRoutes() {
      const el = document.getElementById('results');
      el.innerHTML = '<div class="loading-state">正在載入路線資料...</div>';
      const results = await Promise.allSettled([
        loadKmbRoutes(), loadCtbRoutes(), loadGmbRoutes(), loadMtrBusRoutes(), loadNlbRoutes()
      ]);
      const labels = ['九巴/龍運', '城巴', '專線小巴', '港鐵巴士', '嶼巴'];
      const failed = [];
      const arrays = results.map((r, i) => {
        if (r.status === 'fulfilled') return r.value || [];
        failed.push(labels[i]);
        return [];
      });
      const [kmb, ctb, gmb, mtrbus, nlb] = arrays;
      ALL_ROUTES = [...kmb, ...ctb, ...gmb, ...mtrbus, ...nlb];
      if (ALL_ROUTES.length === 0) {
        ALL_ROUTES = LOCAL_FALLBACK.slice();
        console.warn('Using local fallback routes');
        el.innerHTML = '<div class="empty-state">無法載入路線資料<br><small style="opacity:.7">請檢查網絡後重新整理頁面<br>目前使用備用路線</small></div>';
        setTimeout(() => { routesLoaded = true; renderHome(); }, 1500);
        routesLoaded = true;
        return;
      }
      if (failed.length) {
        console.warn('部分資料來源載入失敗:', failed.join(', '));
      }
      const seen = new Set();
      ALL_ROUTES = ALL_ROUTES.filter(r => {
        const k = r.route + '_' + r.co + (r.bound ? '_' + r.bound : '') + (r.service_type ? '_' + r.service_type : '') + (r.region ? '_' + r.region : '') + (r.nlbRouteId ? '_' + r.nlbRouteId : '');
        if (seen.has(k)) return false;
        seen.add(k);
        return true;
      });
      ALL_ROUTES.sort((a, b) => {
        const cmp = a.route.localeCompare(b.route, 'en', { numeric: true });
        if (cmp !== 0) return cmp;
        // 同一路線：out 在前、in 在後
        if (a.bound === 'out' && b.bound === 'in') return -1;
        if (a.bound === 'in' && b.bound === 'out') return 1;
        return (a.service_type || '1').localeCompare(b.service_type || '1');
      });
      routesLoaded = true;
      console.log('Loaded routes:', ALL_ROUTES.length);
      renderHome();
    }

    // ========== 收藏 & 歷史 ==========
    const LS_FAV = 'hkbus_fav_v1', LS_HIST = 'hkbus_hist_v1';
    const HIST_MAX = 20, FAV_MAX = 30;

    function loadJSON(key, fallback) {
      try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : fallback; }
      catch { return fallback; }
    }
    function saveJSON(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
    }
    function routeKey(m) {
      return `${m.route}_${m.co}_${m.bound || 'out'}${m.region ? '_' + m.region : ''}${m.service_type ? '_' + m.service_type : ''}`;
    }
    function getFavs() { return loadJSON(LS_FAV, []); }
    function getHist() { return loadJSON(LS_HIST, []); }
    function isFav(m) {
      const k = routeKey(m);
      return getFavs().some(f => routeKey(f) === k);
    }
    function toggleFav(m) {
      let list = getFavs();
      const k = routeKey(m);
      const idx = list.findIndex(f => routeKey(f) === k);
      if (idx >= 0) list.splice(idx, 1);
      else { list.unshift(m); if (list.length > FAV_MAX) list = list.slice(0, FAV_MAX); }
      saveJSON(LS_FAV, list);
    }
    function addHistory(m) {
      let list = getHist();
      const k = routeKey(m);
      list = list.filter(f => routeKey(f) !== k);
      list.unshift(m);
      if (list.length > HIST_MAX) list = list.slice(0, HIST_MAX);
      saveJSON(LS_HIST, list);
    }
    function clearHistory() { saveJSON(LS_HIST, []); if (!inputVal) renderHome(); }
    function clearFavs() {
      if (!confirm('確定清除全部收藏？')) return;
      saveJSON(LS_FAV, []);
      if (!inputVal) renderHome();
      updateHeaderFavBtns();
    }
    function updateHeaderFavBtns() {
      if (!state.route || !state.co) return;
      const on = isFav(state);
      ['stopsFavBtn', 'etaFavBtn'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) { btn.textContent = on ? '★' : '☆'; btn.classList.toggle('on', on); }
      });
    }
    function toggleFavFromStops() {
      if (!state.route) return;
      toggleFav({
        route: state.route, co: state.co, bound: state.bound,
        dest: state.directionLabel, region: state.region,
        service_type: state.service_type
      });
      updateHeaderFavBtns();
    }

    function renderSavedItem(item, el) {
      const div = document.createElement('div');
      div.className = 'result-item';
      const plate = plateClass(item);
      const starOn = isFav(item);
      div.innerHTML = `
        <div class="result-num ${plate}">${item.route}</div>
        <div class="result-info">
          <div class="result-dest">往 ${item.dest || '未知目的地'}</div>
          <div class="result-co">${CO_NAMES[item.co] || item.co}${item.region ? ' (' + item.region + ')' : ''}</div>
        </div>
        <button class="fav-btn${starOn ? ' on' : ''}" data-fav="1">${starOn ? '★' : '☆'}</button>
        <div class="result-arrow">›</div>
      `;
      div.addEventListener('click', e => {
        if (e.target.closest('[data-fav]')) {
          e.stopPropagation();
          toggleFav(item);
          if (!inputVal) renderHome();
          return;
        }
        selectRouteDirection(item.route, item.co, item.bound || 'out', item.dest, item.region, item.gmbRouteId, item.gmbRouteSeq, item.service_type, item.nlbRouteId);
      });
      el.appendChild(div);
    }

    function renderHome() {
      const el = document.getElementById('results');
      const favs = getFavs(), hist = getHist();
      el.innerHTML = '';
      if (!favs.length && !hist.length) {
        el.innerHTML = '<div class="home-hint">輸入路線號碼開始搜尋<br><small style="opacity:.7">支援九巴、城巴、嶼巴、專線小巴、港鐵巴士<br>真實到站時間已啟用</small></div>';
        return;
      }
      if (favs.length) {
        const t = document.createElement('div');
        t.className = 'section-title';
        t.innerHTML = '<span>★ 收藏路線</span><button class="clear-link" type="button">清除</button>';
        t.querySelector('.clear-link').onclick = clearFavs;
        el.appendChild(t);
        favs.forEach(item => renderSavedItem(item, el));
      }
      if (hist.length) {
        const t = document.createElement('div');
        t.className = 'section-title';
        t.innerHTML = '<span>最近搜尋</span><button class="clear-link" type="button">清除</button>';
        t.querySelector('.clear-link').onclick = clearHistory;
        el.appendChild(t);
        hist.forEach(item => renderSavedItem(item, el));
      }
    }

    // ========== 主狀態 ==========
    let inputVal = '';
    let state = {
      co: null, route: null, bound: null, region: null,
      directionLabel: null, stopId: null, stopName: null,
      service_type: '1', gmbRouteId: null, gmbRouteSeq: null,
      nlbRouteId: null,
      auto: false, timer: null,
      userLat: null, userLng: null, currentStops: []
    };

    document.getElementById('keypad').addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const k = btn.dataset.k;
      if (k === 'clear') inputVal = '';
      else if (k === 'back') inputVal = inputVal.slice(0, -1);
      else if (k) inputVal += k;
      document.getElementById('routeInput').value = inputVal;
      if (inputVal) searchRoute(inputVal);
      else renderHome();

irs":[{"s":1,"o":"荃灣站","d":"碧堤半島"},{"s":2,"o":"碧堤半島","d":"荃灣站"}]},{"id":2007266,"r":"99","g":"NT","desc":null,"dirs":[{"s":1,"o":"海貴路公共運輸交匯處","d":"海濱花園"},{"s":2,"o":"海濱花園","d":"海貴路公共運輸交匯處"}]},{"id":2004165,"r":"N44B","g":"NT","desc":"通宵服務","dirs":[{"s":1,"o":"落馬洲管制站","d":"屯門碼頭"},{"s":2,"o":"屯門碼頭","d":"落馬洲管制站"}]},{"id":2008059,"r":"96P","g":"NT","desc":"額外班次","dirs":[{"s":1,"o":"荃灣西站公共運輸交匯處","d":"麗城花園(循環線)"}]},{"id":2002549,"r":"9A","g":"NT","desc":"額外班次","dirs":[{"s":1,"o":"北潭涌","d":"萬宜水庫東壩 "},{"s":2,"o":"萬宜水庫東壩","d":"北潭涌"}]},{"id":2005616,"r":"82M","g":"NT","desc":null,"dirs":[{"s":1,"o":"荃灣(兆和街)","d":"象山邨"},{"s":2,"o":"象山邨","d":"荃灣(兆和街)"}]},{"id":2008591,"r":"86","g":"NT","desc":null,"dirs":[{"s":1,"o":"荃灣(海貴路)","d":"石籬(梨貝街)"},{"s":2,"o":"石籬(梨貝街)","d":"荃灣(海貴路)"}]}];
    // 由靜態資料建立 route → regions 索引
    const GMB_INDEX = (() => {
      const idx = {};
      (typeof GMB_STATIC !== 'undefined' ? GMB_STATIC : []).forEach(x => {
        const c = String(x.r || '').toUpperCase();
        if (!idx[c]) idx[c] = [];
        if (x.g && idx[c].indexOf(x.g) < 0) idx[c].push(x.g);
      });
      return idx;
    })();

    let searchSeq = 0;
    const gmbCache = new Map(); // routeCode -> { items, ts }

    // 小巴 API 無 CORS：本機 file:// 會被瀏覽器攔截。
    // 路線搜尋改用內建 GMB_STATIC；車站／ETA 直連失敗時用 jina 代理。
    async function gmbApiFetch(url) {
      try {
        const res = await fetch(url, { cache: 'no-store' });
        if (res.ok) {
          const j = await res.json();
          if (j) return j;
        }
      } catch (e) {
        console.warn('GMB direct failed', e.message || e);
      }
      try {
        const proxy = 'https://r.jina.ai/' + url;
        const res = await fetch(proxy, { cache: 'no-store' });
        const text = await res.text();
        // jina 回傳可能夾雜 Markdown，抽出 JSON
        const m = text.match(/\{[\s\S]*\}/);
        if (m) return JSON.parse(m[0]);
      } catch (e) {
        console.warn('GMB proxy failed', e.message || e);
      }
      return null;
    }

    function gmbItemsFromStatic(code) {
      const found = [];
      const list = (typeof GMB_STATIC !== 'undefined' ? GMB_STATIC : []).filter(
        x => String(x.r || '').toUpperCase() === code
      );
      list.forEach(rd => {
        const desc = (rd.desc && String(rd.desc).trim() && !/^正常班次/.test(rd.desc))
          ? String(rd.desc).trim() : '';
        const dirs = (rd.dirs && rd.dirs.length) ? rd.dirs : [{ s: 1, o: '', d: code }];
        dirs.forEach(d => {
          const bound = d.s === 1 ? 'out' : 'in';
          found.push({
            route: code,
            co: 'gmb',
            region: rd.g,
            bound,
            gmbRouteId: rd.id,
            gmbRouteSeq: d.s || (bound === 'out' ? 1 : 2),
            needsDetail: false,
            orig: d.o || '',
            dest: d.d || '',
            gmbDesc: desc,
            directions: dirs.map(x => ({
              bound: x.s === 1 ? 'out' : 'in',
              orig: x.o || '',
              dest: x.d || '',
              route_seq: x.s
            }))
          });
        });
      });
      return found;
    }

    async function fetchGmbOnDemand(routeCode) {
      const code = String(routeCode || '').toUpperCase().trim();
      if (!code) return [];
      const cached = gmbCache.get(code);
      if (cached && cached.items.length && (Date.now() - cached.ts < 30 * 60 * 1000)) {
        return cached.items.slice();
      }
      // 完全本機靜態資料，不依賴網絡／CORS
      const found = gmbItemsFromStatic(code);
      if (found.length) {
        gmbCache.set(code, { items: found, ts: Date.now() });
      }
      return found.slice();
    }

    function sortSearchMatches(matches, query) {
      matches.sort((a, b) => {
        const aExact = a.route.toUpperCase() === query ? 0 : 1;
        const bExact = b.route.toUpperCase() === query ? 0 : 1;
        if (aExact !== bExact) return aExact - bExact;
        if (aExact === 0 && bExact === 0) {
          const aG = a.co === 'gmb' ? 0 : 1;
          const bG = b.co === 'gmb' ? 0 : 1;
          if (aG !== bG) return aG - bG;
        }
        const cmp = a.route.localeCompare(b.route, 'en', { numeric: true });
        if (cmp !== 0) return cmp;
        if (a.bound === 'out' && b.bound === 'in') return -1;
        if (a.bound === 'in' && b.bound === 'out') return 1;
        if (a.co === 'gmb' && b.co === 'gmb') {
          return (a.region || '').localeCompare(b.region || '');
        }
        return 0;
      });
      return matches;
    }

    function gmbPlaceholdersFromIndex(query) {
      if (typeof GMB_INDEX === 'undefined' || !GMB_INDEX[query]) return [];
      return GMB_INDEX[query].map(region => ({
        route: query,
        co: 'gmb',
        region,
        bound: 'out',
        needsDetail: true,
        orig: '',
        dest: '',
        gmbRouteId: null,
        gmbRouteSeq: 1
      }));
    }

    function collectLocalMatches(query) {
      let matches = routesLoaded
        ? ALL_ROUTES.filter(r => r.route.toUpperCase().startsWith(query))
        : [];
      // 去掉未完成的 exact 小巴，稍後用 live / index 補上
      matches = matches.filter(m => !(m.co === 'gmb' && m.route.toUpperCase() === query));
      const cached = gmbCache.get(query);
      if (cached && cached.items && cached.items.length) {
        matches = cached.items.concat(matches);
      } else {
        matches = gmbPlaceholdersFromIndex(query).concat(matches);
      }
      return sortSearchMatches(matches, query).slice(0, 50);
    }

    let gmbSearchTimer = null;

    function searchRoute(val) {
      const el = document.getElementById('results');
      const query = val.trim().toUpperCase();
      searchSeq++;
      el.innerHTML = '';
      if (!query) { renderHome(); return; }

      // 本機巴士路線 + 內建小巴靜態資料（file:// 無需 API）
      let matches = routesLoaded
        ? ALL_ROUTES.filter(r => r.route.toUpperCase().startsWith(query))
        : [];
      matches = matches.filter(m => !(m.co === 'gmb' && m.route.toUpperCase() === query));
      const gmbLive = gmbItemsFromStatic(query);
      if (gmbLive.length) matches = gmbLive.concat(matches);
      matches = sortSearchMatches(matches, query).slice(0, 50);

      if (matches.length === 0) {
        el.innerHTML = `<div class="empty-state">找不到「${query}」路線<br><small style="opacity:.7">小巴請輸入完整號碼（如 26、46、16A）</small></div>`;
        return;
      }
      renderSearchResultList(el, matches, query, matches.length >= 50);
    }

      let otherSectionAdded = false;
