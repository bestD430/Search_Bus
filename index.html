<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>香港巴士到站時間</title>
  <style>
    :root {
      --primary: #00A0E9;
      --primary-dark: #0088cc;
      --bg: #f2f2f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #8e8e93;
      --border: #e5e5ea;
      --green: #34c759;
      --amber: #ff9500;
      --red: #ff3b30;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
    }

    /* Header */
    .header {
      background: var(--primary);
      color: white;
      text-align: center;
      padding: 14px 16px 12px;
      font-size: 1.1rem;
      font-weight: 600;
      flex-shrink: 0;
      letter-spacing: 1px;
    }

    /* Search input area */
    .search-box {
      background: white;
      padding: 12px 16px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }
    .search-input {
      width: 100%;
      padding: 12px 14px;
      font-size: 1.2rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: #fafafa;
      font-family: inherit;
      letter-spacing: 1px;
      text-align: center;
      font-weight: 600;
    }
    .search-input:focus { border-color: var(--primary); background: white; }
    .search-input::placeholder { color: #c7c7cc; font-weight: 400; letter-spacing: 0; }

    /* Results list */
    .results {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: white;
    }
    .result-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      gap: 12px;
      transition: background 0.1s;
    }
    .result-item:active { background: #f2f2f7; }
    
    /* 路線號字體加大50% (原 1.15rem -> 1.725rem) */
    .result-num {
      font-size: 1.725rem;
      font-weight: 700;
      min-width: 64px;
      text-align: center;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }
    
    /* 路線牌 house color */
    .plate-kmb { background: #E4002B; color: #fff; }          /* 九巴紅 */
    .plate-lwb { background: #F15A22; color: #fff; }          /* 龍運橙 */
    .plate-ctb { background: #FFD100; color: #1a1a1a; }       /* 城巴黃 */
    .plate-nlb { background: #007A3D; color: #fff; }          /* 嶼巴綠 */
    .plate-gmb { background: #00A651; color: #fff; }          /* 小巴綠 */
    .plate-mtrbus { background: #0077C8; color: #fff; }       /* 港鐵藍 */
    .result-info { flex: 1; min-width: 0; }
    .result-dest {
      font-size: 0.98rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .result-co {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .result-arrow {
      color: #c7c7cc;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .empty-state, .loading-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .error-state {
      text-align: center;
      padding: 24px 20px;
      color: var(--red);
      font-size: 0.9rem;
    }

    /* Keypad */
    .keypad {
      flex-shrink: 0;
      background: #5a6570;
      padding: 8px 6px 10px;
      user-select: none;
    }
    .key-row {
      display: flex;
      gap: 5px;
      margin-bottom: 5px;
      justify-content: center;
    }
    .key-row:last-child { margin-bottom: 0; }
    .key {
      flex: 1;
      max-width: 72px;
      height: 46px;
      border: none;
      border-radius: 8px;
      background: white;
      font-size: 1.35rem;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      transition: background 0.08s, transform 0.05s;
    }
    .key:active {
      background: #d1d1d6;
      transform: scale(0.96);
    }
    .key-letter {
      flex: 1;
      max-width: 48px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 1.05rem;
      background: #d8dce0;
      color: #1c1c1e;
      flex: 0 0 42px;
    }
    .key-letter:active { background: #b0b6bc; }
    .key-func {
      background: #8e99a4;
      color: white;
      font-size: 1.1rem;
    }
    .key-func:active { background: #6d7883; }
    .keypad-main {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .num-pad {
      flex: 1.15;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .letter-pad {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .letter-pad .key-row {
      justify-content: center;
    }

    /* Sub pages */
    .page { display: none; flex-direction: column; height: 100%; }
    .page.active { display: flex; }

    .page-header {
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      padding: 12px 8px;
      flex-shrink: 0;
      gap: 4px;
    }
    .back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.4rem;
      padding: 4px 10px;
      cursor: pointer;
      line-height: 1;
    }
    .page-title {
      flex: 1;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 600;
      margin-right: 36px;
    }

    .stop-list, .eta-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: white;
    }
    .stop-item {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .stop-item:active { background: #f2f2f7; }
    .stop-seq {
      font-size: 0.85rem;
      color: var(--muted);
      min-width: 28px;
      font-weight: 600;
    }
    .stop-name { font-size: 0.98rem; font-weight: 500; flex: 1; }
    .stop-arrow { color: #c7c7cc; }

    /* ETA board */
    .eta-header-info {
      background: #1c1c1e;
      color: white;
      padding: 16px;
    }
    
    /* 預計到站頂部路線號字體加大50% (原 1.4rem -> 2.1rem) */
    .eta-route-num {
      font-size: 2.1rem;
      font-weight: 700;
      display: inline-block;
      padding: 4px 14px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }
    .eta-route-num.plate-kmb { background: #E4002B; color: #fff; }
    .eta-route-num.plate-lwb { background: #F15A22; color: #fff; }
    .eta-route-num.plate-ctb { background: #FFD100; color: #1a1a1a; }
    .eta-route-num.plate-nlb { background: #007A3D; color: #fff; }
    .eta-route-num.plate-gmb { background: #00A651; color: #fff; }
    .eta-route-num.plate-mtrbus { background: #0077C8; color: #fff; }
    .eta-dest-text { font-size: 0.95rem; color: #aeaeb2; margin-top: 4px; }
    .eta-stop-text { font-size: 0.9rem; margin-top: 8px; }
    .eta-co-badge {
      display: inline-block;
      background: #3a3a3c;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 0.72rem;
      margin-top: 6px;
    }
    .eta-rows { padding: 8px 0; }
    .eta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .eta-mins {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--green);
      font-variant-numeric: tabular-nums;
    }
    .eta-mins.soon { color: var(--amber); }
    .eta-mins.arrived { color: var(--red); }
    .eta-clock {
      font-size: 0.88rem;
      color: var(--muted);
      text-align: right;
    }
    .eta-empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
    }
    .eta-toolbar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: white;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .eta-btn {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: #f2f2f7;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .eta-btn:active { background: #e5e5ea; }
    .eta-btn.active-refresh {
      background: var(--primary);
      color: white;
    }
    .eta-refresh-info {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      padding: 6px 16px 10px;
      background: white;
    }

    /* Favorites & History */
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px 6px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.5px;
      background: #fafafa;
      border-bottom: 1px solid var(--border);
    }
    .section-title .clear-link {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      padding: 2px 4px;
    }
    .fav-btn {
      background: none;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
      padding: 4px 6px;
      line-height: 1;
      flex-shrink: 0;
      color: #c7c7cc;
      transition: color 0.15s, transform 0.1s;
    }
    .fav-btn.on { color: #ff9500; }
    .fav-btn:active { transform: scale(0.9); }
    .result-item .fav-btn { margin-left: auto; }
    .home-hint {
      text-align: center;
      padding: 28px 20px 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .page-header .fav-btn {
      color: rgba(255,255,255,0.7);
      font-size: 1.3rem;
      margin-right: 4px;
    }
    .page-header .fav-btn.on { color: #ffd60a; }
  </style>
</head>
<body>
  <div class="app">

    <!-- ========== PAGE: SEARCH ========== -->
    <div class="page active" id="pageSearch">
      <div class="header">搜尋</div>
      <div class="search-box">
        <input type="text" class="search-input" id="routeInput" placeholder="輸入路線號碼" readonly inputmode="none">
      </div>
      <div class="results" id="results">
        <div class="empty-state">輸入路線號碼開始搜尋</div>
      </div>
      <div class="keypad" id="keypad">
        <div class="keypad-main">
          <div class="num-pad">
            <div class="key-row">
              <button class="key" data-k="1">1</button>
              <button class="key" data-k="2">2</button>
              <button class="key" data-k="3">3</button>
            </div>
            <div class="key-row">
              <button class="key" data-k="4">4</button>
              <button class="key" data-k="5">5</button>
              <button class="key" data-k="6">6</button>
            </div>
            <div class="key-row">
              <button class="key" data-k="7">7</button>
              <button class="key" data-k="8">8</button>
              <button class="key" data-k="9">9</button>
            </div>
            <div class="key-row">
              <button class="key key-func" data-k="clear">✕</button>
              <button class="key" data-k="0">0</button>
              <button class="key key-func" data-k="back">⌫</button>
            </div>
          </div>
          <div class="letter-pad" id="letterKeys">
          <div class="key-row"><button class="key key-letter" data-k="A">A</button><button class="key key-letter" data-k="B">B</button><button class="key key-letter" data-k="C">C</button><button class="key key-letter" data-k="D">D</button></div>
          <div class="key-row"><button class="key key-letter" data-k="E">E</button><button class="key key-letter" data-k="F">F</button><button class="key key-letter" data-k="H">H</button><button class="key key-letter" data-k="K">K</button></div>
          <div class="key-row"><button class="key key-letter" data-k="M">M</button><button class="key key-letter" data-k="N">N</button><button class="key key-letter" data-k="P">P</button><button class="key key-letter" data-k="R">R</button></div>
          <div class="key-row"><button class="key key-letter" data-k="S">S</button><button class="key key-letter" data-k="T">T</button><button class="key key-letter" data-k="W">W</button><button class="key key-letter" data-k="X">X</button></div>
        </div>
        </div>
      </div>
    </div>

    <!-- ========== PAGE: STOPS ========== -->
    <div class="page" id="pageStops">
      <div class="page-header">
        <button class="back-btn" onclick="goSearch()">‹</button>
        <div class="page-title" id="stopsTitle">選擇車站</div>
        <button class="fav-btn" id="stopsFavBtn" onclick="toggleFavFromStops()" title="收藏此路線">☆</button>
      </div>
      <div class="stop-list" id="stopList">
        <div class="loading-state">載入車站中...</div>
      </div>
    </div>

    <!-- ========== PAGE: ETA ========== -->
    <div class="page" id="pageEta">
      <div class="page-header">
        <button class="back-btn" onclick="goStops()">‹</button>
        <div class="page-title">預計到站</div>
        <button class="fav-btn" id="etaFavBtn" onclick="toggleFavFromEta()" title="收藏此路線">☆</button>
      </div>
      <div class="eta-area" id="etaArea">
        <div class="eta-header-info">
          <div class="eta-route-num" id="etaRoute">—</div>
          <div class="eta-dest-text" id="etaDest">—</div>
          <div class="eta-stop-text" id="etaStopName">—</div>
          <div class="eta-co-badge" id="etaCo">—</div>
        </div>
        <div class="eta-rows" id="etaRows"></div>
        <div class="eta-refresh-info" id="etaInfo"></div>
      </div>
      <div class="eta-toolbar">
        <button class="eta-btn" onclick="fetchETA()">🔄 刷新</button>
        <button class="eta-btn" id="btnAuto" onclick="toggleAuto()">▶ 自動刷新</button>
      </div>
    </div>

  </div>

  <script>
    const LETTERS = ['A','B','C','D','E','F','H','K','M','N','P','R','S','T','W','X'];
    const CO_NAMES = {
      kmb: '九巴',
      lwb: '龍運',
      ctb: '城巴',
      nlb: '嶼巴（大嶼山巴士）',
      gmb: '專線小巴',
      mtrbus: '港鐵巴士'
    };

    function isLWB(route) {
      const r = String(route).toUpperCase();
      if (/^A[3-5]\d/.test(r)) return true;
      if (/^E[3-4]\d/.test(r)) return true;
      if (/^S(1|64)/.test(r)) return true;
      if (/^R(8|33|42)/.test(r)) return true;
      if (/^N(30|31|36|39|42|64)/.test(r)) return true;
      return false;
    }

    const letterBox = document.getElementById('letterKeys');
    // 字母鍵已在 HTML 靜態產生；僅在空白時才動態補上（兼容舊版）
    if (letterBox && !letterBox.children.length) {
      for (let i = 0; i < LETTERS.length; i += 4) {
        const row = document.createElement('div');
        row.className = 'key-row';
        LETTERS.slice(i, i + 4).forEach(L => {
          const b = document.createElement('button');
          b.className = 'key key-letter';
          b.dataset.k = L;
          b.textContent = L;
          row.appendChild(b);
        });
        letterBox.appendChild(row);
      }
    }

    // ========== 收藏 & 歷史 ==========
    const LS_FAV = 'hkbus_fav_v1';
    const LS_HIST = 'hkbus_hist_v1';
    const HIST_MAX = 20;
    const FAV_MAX = 30;

    function loadJSON(key, fallback) {
      try {
        const s = localStorage.getItem(key);
        if (!s) return fallback;
        const v = JSON.parse(s);
        return Array.isArray(v) ? v : fallback;
      } catch { return fallback; }
    }
    function saveJSON(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
    }

    function routeKey(m, route) {
      return [
        (route || m.route || '').toUpperCase(),
        m.co || '',
        m.bound || '',
        m.serviceType || '1',
        m.nlbRouteId || '',
        m.gmbRouteId || '',
        m.gmbRouteSeq || '',
        m.mtrDir || '',
        m.dirPath || ''
      ].join('|');
    }

    function snapshotRoute(m, route) {
      return {
        key: routeKey(m, route),
        route: (route || m.route || '').toUpperCase(),
        co: m.co,
        bound: m.bound,
        serviceType: m.serviceType || '1',
        label: m.label || '',
        sub: m.sub || '',
        dest: m.dest || '',
        nlbRouteId: m.nlbRouteId || null,
        gmbRouteId: m.gmbRouteId || null,
        gmbRouteSeq: m.gmbRouteSeq || null,
        dirPath: m.dirPath || null,
        mtrDir: m.mtrDir || '',
        at: Date.now()
      };
    }

    function getFavs() { return loadJSON(LS_FAV, []); }
    function getHist() { return loadJSON(LS_HIST, []); }

    function isFav(m, route) {
      const k = routeKey(m, route);
      return getFavs().some(f => f.key === k);
    }

    function toggleFav(m, route) {
      let list = getFavs();
      const k = routeKey(m, route);
      const idx = list.findIndex(f => f.key === k);
      if (idx >= 0) {
        list.splice(idx, 1);
      } else {
        list.unshift(snapshotRoute(m, route));
        if (list.length > FAV_MAX) list = list.slice(0, FAV_MAX);
      }
      saveJSON(LS_FAV, list);
      return idx < 0; // true if now favorited
    }

    function addHistory(m, route) {
      let list = getHist();
      const snap = snapshotRoute(m, route);
      list = list.filter(h => h.key !== snap.key);
      list.unshift(snap);
      if (list.length > HIST_MAX) list = list.slice(0, HIST_MAX);
      saveJSON(LS_HIST, list);
    }

    function clearHistory() {
      saveJSON(LS_HIST, []);
      if (!inputVal) renderHome();
    }

    function clearFavs() {
      if (!confirm('確定清除全部收藏？')) return;
      saveJSON(LS_FAV, []);
      if (!inputVal) renderHome();
      updateHeaderFavBtns();
    }

    function favItemFromState() {
      return {
        route: state.route,
        co: state.co,
        bound: state.bound,
        serviceType: state.serviceType || '1',
        label: state.directionLabel || '',
        sub: '',
        dest: state.directionLabel || '',
        nlbRouteId: state.nlbRouteId,
        gmbRouteId: state.gmbRouteId,
        gmbRouteSeq: state.gmbRouteSeq,
        dirPath: state.dirPath,
        mtrDir: state.mtrDir || ''
      };
    }

    function updateHeaderFavBtns() {
      if (!state.route || !state.co) return;
      const m = favItemFromState();
      const on = isFav(m, state.route);
      ['stopsFavBtn', 'etaFavBtn'].forEach(id => {
        const btn = document.getElementById(id);
        if (!btn) return;
        btn.textContent = on ? '★' : '☆';
        btn.classList.toggle('on', on);
      });
    }

    function toggleFavFromStops() {
      if (!state.route) return;
      const m = favItemFromState();
      toggleFav(m, state.route);
      updateHeaderFavBtns();
    }
    function toggleFavFromEta() {
      toggleFavFromStops();
    }

    function renderSavedItem(item, el, showStar) {
      const div = document.createElement('div');
      div.className = 'result-item';
      const plate = 'plate-' + (item.co || 'kmb');
      const destText = (item.label || '').replace(/^.*?→\s*/, '') || item.dest || item.route;
      const coTag = (item.co === 'nlb' || item.co === 'ctb' || item.co === 'gmb' || item.co === 'mtrbus')
        ? ' - ' + shortCo(item.co) : '';
      const starOn = isFav(item, item.route);
      div.innerHTML =
        '<div class="result-num ' + plate + '">' + item.route + '</div>' +
        '<div class="result-info">' +
          '<div class="result-dest">往 ' + destText + coTag + '</div>' +
          '<div class="result-co">' + (CO_NAMES[item.co] || item.co || '') + (item.sub ? ' · ' + item.sub : '') + '</div>' +
        '</div>' +
        (showStar
          ? '<button class="fav-btn' + (starOn ? ' on' : '') + '" data-fav="1">' + (starOn ? '★' : '☆') + '</button>'
          : '') +
        '<div class="result-arrow">›</div>';
      div.addEventListener('click', e => {
        if (e.target.closest('[data-fav]')) {
          e.stopPropagation();
          toggleFav(item, item.route);
          if (!inputVal) renderHome();
          else {
            // refresh star on this row
            const btn = div.querySelector('[data-fav]');
            if (btn) {
              const on = isFav(item, item.route);
              btn.textContent = on ? '★' : '☆';
              btn.classList.toggle('on', on);

    document.getElementById('keypad').addEventListener('click', e => {
      const btn = e.target.closest('[data-k]');
      if (!btn) return;
      const k = btn.dataset.k;
      if (k === 'clear') {
        inputVal = '';
      } else if (k === 'back') {
        inputVal = inputVal.slice(0, -1);
      } else {
        if (inputVal.length >= 6) return;
        inputVal += k;
      }
      document.getElementById('routeInput').value = inputVal;
      scheduleSearch();
    });

    function scheduleSearch() {
      clearTimeout(searchTimer);
      if (!inputVal) {
        renderHome();
        return;
      }
      document.getElementById('results').innerHTML = '<div class="loading-state">搜尋中...</div>';
      searchTimer = setTimeout(() => doSearch(inputVal), 280);
    }

    async function doSearch(route) {
      route = route.toUpperCase();
      try {
        const results = await Promise.allSettled([
          searchKMB(route),
          searchCTB(route),
          searchNLB(route),
          searchGMB(route),
          searchMTRBus(route)
        ]);
        let all = [];
        results.forEach(r => { if (r.status === 'fulfilled') all = all.concat(r.value || []); });
        if (inputVal.toUpperCase() !== route) return;
        if (all.length === 0) {
          document.getElementById('results').innerHTML = '<div class="error-state">找不到路線「' + route + '」</div>';
          return;
        }
        renderResults(all, route);
      } catch (e) {
        document.getElementById('results').innerHTML = '<div class="error-state">搜尋失敗，請重試</div>';
      }
    }

    function renderResults(list, route) {
      const el = document.getElementById('results');
      el.innerHTML = '';
      list.forEach(m => {
        const div = document.createElement('div');
        div.className = 'result-item';
        const plate = 'plate-' + (m.co || 'kmb');
        const destText = m.label.replace(/^.*?→\s*/, '');
        const coTag = (m.co === 'nlb' || m.co === 'ctb' || m.co === 'gmb' || m.co === 'mtrbus') ? ' - ' + shortCo(m.co) : '';
        const starOn = isFav(m, route);
        div.innerHTML =
          '<div class="result-num ' + plate + '">' + route + '</div>' +
          '<div class="result-info">' +
            '<div class="result-dest">往 ' + destText + coTag + '</div>' +
            '<div class="result-co">' + CO_NAMES[m.co] + (m.sub ? ' · ' + m.sub : '') + '</div>' +
          '</div>' +
          '<button class="fav-btn' + (starOn ? ' on' : '') + '" data-fav="1" title="收藏">' + (starOn ? '★' : '☆') + '</button>' +
          '<div class="result-arrow">›</div>';
        div.addEventListener('click', e => {
          if (e.target.closest('[data-fav]')) {
            e.stopPropagation();
            const on = toggleFav(m, route);
            const btn = div.querySelector('[data-fav]');
            if (btn) {
              btn.textContent = on ? '★' : '☆';
              btn.classList.toggle('on', on);
            }
            return;
          }
          selectRoute(m, route);
        });
        el.appendChild(div);
      });
    }

    function shortCo(co) {
      return { ctb: '城巴', nlb: '嶼巴', gmb: '小巴', mtrbus: '港鐵巴士', kmb: '' }[co] || '';
    }

    async function searchKMB(route) {
      try {
        const now = Date.now();
        if (!cache.kmbRoutes || now - cache.kmbAt > TTL) {
          const res = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route/');
          if (!res.ok) return [];
          cache.kmbRoutes = (await res.json()).data || [];
          cache.kmbAt = now;
        }
        return cache.kmbRoutes.filter(r => r.route.toUpperCase() === route).map(m => ({
          co: isLWB(m.route) ? 'lwb' : 'kmb', bound: m.bound, serviceType: m.service_type,
          label: m.orig_tc + ' → ' + m.dest_tc,
          sub: (m.bound === 'O' ? '去程' : '回程') + ' · 類型' + m.service_type,
          dest: m.dest_tc
        }));
      } catch { return []; }
    }

    async function searchCTB(route) {
      try {
        const res = await fetch('https://rt.data.gov.hk/v2/transport/citybus/route/CTB/' + route);
        if (!res.ok) return [];
        const json = await res.json();
        if (!json.data) return [];
        const dirs = await Promise.all(['inbound', 'outbound'].map(async dir => {
          try {
            const sRes = await fetch('https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/' + route + '/' + dir);
            const sJson = await sRes.json();
            if (sJson.data && sJson.data.length) {
              return {
                co: 'ctb',
                bound: dir === 'outbound' ? 'O' : 'I',
                serviceType: '1',
                dirPath: dir,
                label: dir === 'outbound'
                  ? json.data.orig_tc + ' → ' + json.data.dest_tc
                  : json.data.dest_tc + ' → ' + json.data.orig_tc,
                sub: dir === 'outbound' ? '去程' : '回程',
                dest: dir === 'outbound' ? json.data.dest_tc : json.data.orig_tc
              };
            }
          } catch {}
          return null;
        }));
        return dirs.filter(Boolean);
      } catch { return []; }
    }

    async function searchNLB(route) {
      try {
        const now = Date.now();
        if (!cache.nlbRoutes || now - cache.nlbAt > TTL) {
          const res = await fetch('https://rt.data.gov.hk/v2/transport/nlb/route.php?action=list');
          if (!res.ok) return [];
          cache.nlbRoutes = (await res.json()).routes || [];
          cache.nlbAt = now;
        }
        return cache.nlbRoutes.filter(r => r.routeNo.toUpperCase() === route).map(m => ({
          co: 'nlb', bound: 'O', serviceType: '1', nlbRouteId: m.routeId,
          label: m.routeName_c, sub: '', dest: m.routeName_c
        }));
      } catch { return []; }
    }

    
    // 通用 JSON 請求：file:// 下 Safari 常出現 "Load failed"，加入 XHR 與代理後備
    async function fetchJSON(url, options) {
      options = options || {};
      const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      const timer = ctrl ? setTimeout(() => ctrl.abort(), options.timeout || 15000) : null;
      const opts = Object.assign({
        method: 'GET',
        cache: 'no-store',
        credentials: 'omit',
        mode: 'cors',
        signal: ctrl ? ctrl.signal : undefined,
        headers: { 'Accept': 'application/json' }
      }, options);
      delete opts.timeout;

      // 1) fetch
      try {
        const res = await fetch(url, opts);
        if (timer) clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
      } catch (e1) {
        if (timer) clearTimeout(timer);
        // 2) XHR 後備
        try {
          const data = await new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open(opts.method || 'GET', url, true);
            xhr.timeout = options.timeout || 15000;
            xhr.setRequestHeader('Accept', 'application/json');
            xhr.onload = function () {
              if (xhr.status >= 200 && xhr.status < 300) {
                try { resolve(JSON.parse(xhr.responseText)); }
                catch (err) { reject(err); }
              } else reject(new Error('HTTP ' + xhr.status));
            };
            xhr.onerror = function () { reject(new Error('網絡錯誤')); };
            xhr.ontimeout = function () { reject(new Error('逾時')); };
            xhr.send(opts.body || null);
          });
          return data;
        } catch (e2) {
          // 3) 公開 CORS 代理後備（僅 GET）
          if ((opts.method || 'GET').toUpperCase() === 'GET') {
            const proxies = [
              'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
              'https://cors.eu.org/' + url
            ];
            let lastErr = e2;
            for (let i = 0; i < proxies.length; i++) {
              try {
                const res = await fetch(proxies[i], { cache: 'no-store', credentials: 'omit' });
                if (!res.ok) throw new Error('proxy HTTP ' + res.status);
                const text = await res.text();
                // allorigins 有時包一層
                try { return JSON.parse(text); } catch (_) {}
                try {
                  const wrapped = JSON.parse(text);
                  if (wrapped && wrapped.contents) return JSON.parse(wrapped.contents);
                } catch (_) {}
                throw new Error('代理回應無效');
              } catch (e3) { lastErr = e3; }
            }
            throw lastErr;
          }
          throw e2;
        }
      }
    }

    function friendlyNetError(e) {
      const msg = (e && e.message) ? String(e.message) : '';
      if (/load failed|failed to fetch|networkerror|網絡錯誤|abort/i.test(msg)) {
        return '無法連線到伺服器（Load failed）。若以「檔案」直接開啟，iOS 可能封鎖部分網站；請用 Wi‑Fi 重試，或改以瀏覽器開啟網頁版。';
      }
      return msg || '載入失敗';
    }

    async function searchGMB(route) {
      const names = { HKI: '港島', KLN: '九龍', NT: '新界' };
      const key = String(route).toUpperCase().trim();
      const out = [];
      // 1) 內嵌索引（本機 file:// 可用）
      try {
        if (typeof GMB_ROUTE_INDEX !== 'undefined' && GMB_ROUTE_INDEX[key]) {
          GMB_ROUTE_INDEX[key].forEach(item => {
            (item.d || []).forEach(d => {
              out.push({
                co: 'gmb', bound: String(d.s), serviceType: '1',
                gmbRouteId: item.id, gmbRouteSeq: d.s,
                label: (d.o || '') + ' → ' + (d.t || ''),
                sub: names[item.r] || item.r || '專線小巴',
                dest: d.t || ''
              });
            });
          });
        }
      } catch (e) { console.warn('GMB index', e); }
      if (out.length) return out;

      // 2) 線上 API 後備
      const regions = ['HKI', 'KLN', 'NT'];
      const parts = await Promise.all(regions.map(async region => {
        try {
          const res = await fetch('https://data.etagmb.gov.hk/route/' + region + '/' + encodeURIComponent(key));
          if (!res.ok) return [];
          const data = (await res.json()).data || [];
          const rows = [];
          data.forEach(item => {
            (item.directions || []).forEach(d => {
              rows.push({
                co: 'gmb', bound: String(d.route_seq), serviceType: '1',
                gmbRouteId: item.route_id, gmbRouteSeq: d.route_seq,
                label: (d.orig_tc || '') + ' → ' + (d.dest_tc || ''),
                sub: names[region], dest: d.dest_tc || ''
              });
            });
          });
          return rows;
        } catch { return []; }
      }));
      return parts.flat();
    }

    async function searchMTRBus(route) {
      if (!/^K[\dA-Z]+$/i.test(route) && !/^506$/i.test(route)) return [];
      try {
        const res = await fetch('https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ language: 'zh', routeName: route })
        });
        if (!res.ok) return [];
        const json = await res.json();
        const stops = json.busStop || [];
        // status 3 = suspended; empty list = no data (still may be valid route off-service)
        if (json.routeStatus === '3') return [];
        if (!stops.length) {
          // 無實時資料時仍用官方路線名提供可選項
          const off = MTR_ROUTE_OFFICIAL[route] || MTR_ROUTE_OFFICIAL[route.toUpperCase()];
          if (!off) return [];
          return [{
            co: 'mtrbus', bound: 'O', serviceType: '1', mtrDir: '',
            label: off.label || off.name || ('港鐵巴士 ' + route),
            sub: off.circular ? '循環線' : '',
            dest: off.dest || route
          }];
        }

        // 支援 -U / -D / -nU / -nD
        const isUId = id => /-[n]?U/i.test(id || '');
        const isDId = id => /-[n]?D/i.test(id || '');
        const uStops = stops.filter(s => isUId(s.busStopId));
        const dStops = stops.filter(s => isDId(s.busStopId));
        const dirMeta = MTR_ROUTE_DIRS[route] || MTR_ROUTE_DIRS[route.toUpperCase()] || {};
        const off = MTR_ROUTE_OFFICIAL[route] || MTR_ROUTE_OFFICIAL[route.toUpperCase()] || {};
        const out = [];

        function nameOf(stop) {
          const id = stop.busStopId || '';
          return MTR_STOP_NAMES[id] || id;
        }
        function halfLabel(group, fallbackMeta, reverseOfficial) {
          if (group && group.length) {
            const a = nameOf(group[0]);
            const b = nameOf(group[group.length - 1]);
            if (a && b && a !== b) return a + ' → ' + b;
          }
          if (fallbackMeta) {
            if (fallbackMeta.orig && fallbackMeta.dest && fallbackMeta.orig !== fallbackMeta.dest) {
              return fallbackMeta.orig + ' → ' + fallbackMeta.dest;
            }
            if (fallbackMeta.label) return fallbackMeta.label;
          }
          if (off.orig && off.dest && off.orig !== off.dest) {
            return reverseOfficial ? (off.dest + ' → ' + off.orig) : (off.orig + ' → ' + off.dest);
          }
          return off.name || off.label || ('港鐵巴士 ' + route);
        }

        if (uStops.length && dStops.length) {
          // 雙向或循環線的兩半
          const circ = !!(off.circular || (dirMeta.O && dirMeta.O.circular));
          out.push({
            co: 'mtrbus', bound: 'O', serviceType: '1', mtrDir: 'U',
            label: halfLabel(uStops, dirMeta.O, false),
            sub: circ ? '循環 · 去程' : '去程',
            dest: nameOf(uStops[uStops.length - 1])
          });
          out.push({
            co: 'mtrbus', bound: 'I', serviceType: '1', mtrDir: 'D',
            label: halfLabel(dStops, dirMeta.I || dirMeta.O, true),
            sub: circ ? '循環 · 回程' : '回程',
            dest: nameOf(dStops[dStops.length - 1])
          });
        } else if (uStops.length) {
          out.push({
            co: 'mtrbus', bound: 'O', serviceType: '1', mtrDir: 'U',
            label: halfLabel(uStops, dirMeta.O || dirMeta.I, false),
            sub: off.circular ? '循環線' : '去程',
            dest: nameOf(uStops[uStops.length - 1])
          });
        } else if (dStops.length) {
          // 只有 D 站：可能是單向（如 K14、K52P），用官方去程名稱，不要標成回程
          const meta = dirMeta.O || dirMeta.I || {};
          out.push({
            co: 'mtrbus', bound: 'O', serviceType: '1', mtrDir: 'D',
            label: halfLabel(dStops, meta, false),
            sub: off.circular ? '循環線' : (meta.label ? '' : '去程'),
            dest: nameOf(dStops[dStops.length - 1])
          });
        } else {
          // 無法從 stopId 分辨方向，整條顯示
          out.push({
            co: 'mtrbus', bound: 'O', serviceType: '1', mtrDir: '',
            label: off.label || off.name || ('港鐵巴士 ' + route),
            sub: off.circular ? '循環線' : '',
            dest: off.dest || route
          });
        }
        return out;
      } catch { return []; }
    }

    async function selectRoute(m, route) {
      state.co = m.co;
      state.route = route;
      state.bound = m.bound;
      state.serviceType = m.serviceType || '1';
      state.directionLabel = m.label;
      state.nlbRouteId = m.nlbRouteId || null;
      state.gmbRouteId = m.gmbRouteId || null;
      state.gmbRouteSeq = m.gmbRouteSeq || null;
      state.dirPath = m.dirPath || (m.bound === 'O' ? 'outbound' : 'inbound');
      state.mtrDir = m.mtrDir || '';

      addHistory(m, route);
      showPage('pageStops');
      updateHeaderFavBtns();
      document.getElementById('stopsTitle').textContent = route + ' · ' + (m.dest || m.label);
      document.getElementById('stopList').innerHTML = '<div class="loading-state">載入車站中...</div>';

      try {
        let stops = [];
        if (state.co === 'kmb' || state.co === 'lwb') stops = await loadStopsKMB();
        else if (state.co === 'ctb') stops = await loadStopsCTB();
        else if (state.co === 'nlb') stops = await loadStopsNLB();
        else if (state.co === 'gmb') stops = await loadStopsGMB();
        else if (state.co === 'mtrbus') stops = await loadStopsMTRBus();
        renderStops(stops);
      } catch (e) {
        document.getElementById('stopList').innerHTML = '<div class="error-state">' + e.message + '</div>';
      }
    }

    async function getKMBStopName(stopId) {
      if (cache.stopNames[stopId]) return cache.stopNames[stopId];
      try {
        const j = await (await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop/' + stopId)).json();
        const name = (j.data && j.data.name_tc) || stopId;
        cache.stopNames[stopId] = name;
        return name;
      } catch {
        return stopId;
      }
    }

    async function loadStopsKMB() {
      const dir = state.bound === 'O' ? 'outbound' : 'inbound';
      const res = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/' + state.route + '/' + dir + '/' + state.serviceType);
      if (!res.ok) throw new Error('無法取得車站');
      const raw = (await res.json()).data || [];
      const stops = await Promise.all(raw.map(async s => {
        const name = await getKMBStopName(s.stop);
        return { seq: s.seq, stopId: s.stop, name: name };
      }));
      return stops.sort((a, b) => Number(a.seq) - Number(b.seq));
    }

    async function getCTBStopName(stopId) {
      if (cache.stopNames[stopId]) return cache.stopNames[stopId];
      try {
        const j = await (await fetch('https://rt.data.gov.hk/v2/transport/citybus/stop/' + stopId)).json();
        const name = (j.data && j.data.name_tc) || stopId;
        cache.stopNames[stopId] = name;
        return name;
      } catch {
        return stopId;
      }
    }

    async function loadStopsCTB() {
      const res = await fetch('https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/' + state.route + '/' + state.dirPath);
      if (!res.ok) throw new Error('無法取得車站');
      const raw = (await res.json()).data || [];
      const stops = await Promise.all(raw.map(async s => {
        const name = await getCTBStopName(s.stop);
        return { seq: s.seq, stopId: s.stop, name: name };
      }));
      return stops.sort((a, b) => Number(a.seq) - Number(b.seq));
    }

    async function loadStopsNLB() {
      const res = await fetch('https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=list&routeId=' + state.nlbRouteId);
      if (!res.ok) throw new Error('無法取得車站');
      return ((await res.json()).stops || []).map((s, i) => ({ seq: i + 1, stopId: s.stopId, name: s.stopName_c }));
    }

    async function loadStopsGMB() {
      const key = String(state.gmbRouteId) + ':' + String(state.gmbRouteSeq);
      try {
        if (typeof GMB_STOPS !== 'undefined' && GMB_STOPS[key] && GMB_STOPS[key].length) {
          return GMB_STOPS[key].map(s => ({
            seq: s.q, stopId: s.i, name: s.n || String(s.i)
          }));
        }
      } catch (e) { console.warn('GMB stops embed', e); }
      try {
        const res = await fetch('https://data.etagmb.gov.hk/route-stop/' + state.gmbRouteId + '/' + state.gmbRouteSeq);
        if (!res.ok) throw new Error('無法取得車站');
        const json = await res.json();
        const list = (json.data && json.data.route_stops) || (Array.isArray(json.data) ? json.data : []) || [];
        if (!list.length) throw new Error('沒有車站資料');
        return list.map(s => ({ seq: s.stop_seq, stopId: s.stop_id, name: s.name_tc || s.name_en || s.stop_id }));
      } catch (e) {
        throw new Error('無法取得專線小巴車站。若以檔案直接開啟，請改用 Safari／Chrome 透過網頁伺服器開啟，或重試。');
      }
    }

    // 修正港鐵巴士站名：用 busStopId 對應內嵌站名表，並按 U/D/nU/nD 過濾
    async function loadStopsMTRBus() {
      const res = await fetch('https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ language: 'zh', routeName: state.route })
      });
      if (!res.ok) throw new Error('無法取得車站資料');
      const json = await res.json();
      if (json.routeStatus === '3') {
        throw new Error(json.routeStatusRemarkTitle || '此路線暫停服務');
      }
      let list = json.busStop || [];
      if (!list.length) throw new Error('暫無車站／到站資料（可能非服務時間）');

      const isUId = id => /-[n]?U/i.test(id || '');
      const isDId = id => /-[n]?D/i.test(id || '');
      if (state.mtrDir === 'U') {
        list = list.filter(s => isUId(s.busStopId));
      } else if (state.mtrDir === 'D') {
        list = list.filter(s => isDId(s.busStopId));
      }

      return list.map((s, i) => {
        const id = s.busStopId || String(i + 1);
        const name = MTR_STOP_NAMES[id] || id;
        return { seq: i + 1, stopId: id, name: name, raw: s };
      });
    }

    function renderStops(stops) {
      const el = document.getElementById('stopList');
      el.innerHTML = '';
      if (!stops.length) { el.innerHTML = '<div class="error-state">沒有車站資料</div>'; return; }
      stops.forEach(s => {
        const div = document.createElement('div');
        div.className = 'stop-item';
        div.innerHTML = '<div class="stop-seq">' + s.seq + '</div><div class="stop-name">' + s.name + '</div><div class="stop-arrow">›</div>';
        div.onclick = () => selectStop(s);
        el.appendChild(div);
      });
    }

    function selectStop(s) {
      state.stopId = s.stopId;
      state.stopName = s.name;
      state.mtrRawStop = s.raw || null;
      showPage('pageEta');
      const etaRouteEl = document.getElementById('etaRoute');
      etaRouteEl.textContent = state.route;
      etaRouteEl.className = 'eta-route-num plate-' + (state.co || 'kmb');
      document.getElementById('etaDest').textContent = state.directionLabel || '';
      document.getElementById('etaStopName').textContent = s.name || '';
      document.getElementById('etaCo').textContent = CO_NAMES[state.co] || state.co || '';
      updateHeaderFavBtns && updateHeaderFavBtns();
      startAutoRefresh();
    }

    async function fetchETA() {
      const rows = document.getElementById('etaRows');
      rows.innerHTML = '<div class="eta-empty">載入中...</div>';
      try {
        let etas = [];
        if (state.co === 'kmb' || state.co === 'lwb') etas = await etaKMB();
        else if (state.co === 'ctb') etas = await etaCTB();
        else if (state.co === 'nlb') etas = await etaNLB();
        else if (state.co === 'gmb') etas = await etaGMB();
        else if (state.co === 'mtrbus') etas = await etaMTR();
        renderETA(etas);
      } catch (e) {
        const msg = (typeof friendlyNetError === 'function') ? friendlyNetError(e) : (e.message || '載入失敗');
        rows.innerHTML = '<div class="eta-empty">' + msg + '</div>';
      }
    }

    async function etaKMB() {
      const res = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/eta/' + state.stopId + '/' + state.route + '/' + state.serviceType);
      if (!res.ok) throw new Error('無法取得到站時間');
      return ((await res.json()).data || []).filter(e => e.dir === state.bound && e.eta)
        .map(e => ({ eta: e.eta, rmk: e.rmk_tc || '' }))
        .sort((a, b) => new Date(a.eta) - new Date(b.eta));
    }

    async function etaCTB() {
      const res = await fetch('https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/' + state.stopId + '/' + state.route);
      if (!res.ok) throw new Error('無法取得到站時間');
      const dir = state.bound === 'O' ? 'O' : 'I';
      return ((await res.json()).data || []).filter(e => e.dir === dir && e.eta)
        .map(e => ({ eta: e.eta, rmk: e.rmk_tc || e.rmk || '' }))
        .sort((a, b) => new Date(a.eta) - new Date(b.eta));
    }

    async function etaNLB() {
      const res = await fetch('https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=estimatedArrivals&routeId=' + state.nlbRouteId + '&stopId=' + state.stopId + '&language=zh');
      if (!res.ok) throw new Error('無法取得到站時間');
      return ((await res.json()).estimatedArrivals || []).filter(e => e.estimatedArrivalTime)
        .map(e => ({ eta: e.estimatedArrivalTime.replace(' ', 'T') + '+08:00', rmk: e.routeVariantName || '' }))
        .sort((a, b) => new Date(a.eta) - new Date(b.eta));
    }

    async function etaGMB() {
      if (!state.stopId) throw new Error('未選擇車站');
      let json;
      try {
        json = await fetchJSON('https://data.etagmb.gov.hk/eta/stop/' + encodeURIComponent(state.stopId), { timeout: 15000 });
      } catch (e) {
        throw new Error(friendlyNetError(e));
      }
      const list = Array.isArray(json.data) ? json.data : [];
      if (!list.length) return [];

      const rid = state.gmbRouteId != null ? String(state.gmbRouteId) : '';
      const seq = state.gmbRouteSeq != null ? String(state.gmbRouteSeq) : null;

      function pushEtas(item, bag) {
        (item.eta || []).forEach(e => {
          let etaIso = null;
          const diff = (e.diff != null && e.diff !== '') ? Number(e.diff) : NaN;
          if (!isNaN(diff)) {
            etaIso = new Date(Date.now() + diff * 60000).toISOString();
          } else if (e.timestamp) {
            const t = Date.parse(e.timestamp);
            if (!isNaN(t)) etaIso = new Date(t).toISOString();
          }
          if (!etaIso) return;
          const rmk = e.remarks_tc || e.remarks_en || '';
          bag.push({ eta: etaIso, rmk: rmk });
        });
      }

      let etas = [];
      list.forEach(item => {
        if (rid && String(item.route_id) !== rid) return;
        if (seq != null && String(item.route_seq) !== seq) return;
        pushEtas(item, etas);
      });
      if (!etas.length && rid) {
        list.forEach(item => {
          if (String(item.route_id) !== rid) return;
          pushEtas(item, etas);
        });
      }
      if (!etas.length) {
        list.forEach(item => pushEtas(item, etas));
      }

      etas.sort((a, b) => new Date(a.eta) - new Date(b.eta));
      const seen = new Set();
      etas = etas.filter(e => {
        const k = Math.round(new Date(e.eta).getTime() / 30000);
        if (seen.has(k)) return false;
        seen.add(k);
        return true;
      });
      return etas;
    }

    async function etaMTR() {
      const res = await fetch('https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ language: 'zh', routeName: state.route })
      });
      if (!res.ok) throw new Error('無法取得到站時間');
      const json = await res.json();
      const stop = (json.busStop || []).find(s => (s.busStopId || '') === state.stopId) || state.mtrRawStop;
      if (!stop) return [];
      return (stop.bus || []).map(b => {
        // 108000 為佔位值（無實時 GPS），改用 departureTimeInSecond
        let secStr = b.arrivalTimeInSecond;
        if (secStr === '108000' || secStr === 108000) {
          secStr = b.departureTimeInSecond;
        }
        const sec = parseInt(secStr, 10);
        const text = b.arrivalTimeText || b.departureTimeText || '';
        const rmkParts = [];
        if (b.isScheduled === '1') rmkParts.push('預定班次');
        if (b.busRemark) rmkParts.push(b.busRemark);
        if (text && !/^\d/.test(text) && text !== '即將到站/已離開' && text !== '即將開出/已離開') {
          rmkParts.push(text);
        }
        return {
          eta: new Date(Date.now() + (isNaN(sec) ? 0 : sec * 1000)).toISOString(),
          rmk: rmkParts.filter(Boolean).join(' · ')
        };
      }).filter(e => {
        // 過濾過期過久或無效的時間（超過 3 小時當無效）
        const mins = (new Date(e.eta) - Date.now()) / 60000;
        return mins > -5 && mins < 180;
      });
    }

    function renderETA(etas) {
      const rows = document.getElementById('etaRows');
      if (!etas || !etas.length) {
        rows.innerHTML = '<div class="eta-empty">暫無預計到站時間<br><small>可能是非服務時間、末班車已過，或此站暫無 GPS 資料</small></div>';
        document.getElementById('etaInfo').textContent = '最後更新：' + new Date().toLocaleTimeString('zh-HK');
        return;
      }
      rows.innerHTML = '';
      const now = Date.now();
      let shown = 0;
      etas.forEach(e => {
        if (shown >= 6) return;
        const d = new Date(e.eta);
        if (isNaN(d.getTime())) return;
        const mins = Math.round((d.getTime() - now) / 60000);
        // 略過已過超過 2 分鐘的
        if (mins < -2) return;
        let text, cls = '';
        if (mins <= 0) { text = '即將到達'; cls = 'arrived'; }
        else if (mins <= 2) { text = mins + ' 分鐘'; cls = 'soon'; }
        else { text = mins + ' 分鐘'; }
        const clock = d.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', hour12: false });
        const div = document.createElement('div');
        div.className = 'eta-row';
        div.innerHTML = '<div class="eta-mins ' + cls + '">' + text + '</div><div class="eta-clock">' + clock + (e.rmk ? '<br>' + e.rmk : '') + '</div>';
        rows.appendChild(div);
        shown++;
      });
      if (!shown) {
        rows.innerHTML = '<div class="eta-empty">暫無預計到站時間<br><small>可能是非服務時間或末班車已過</small></div>';
      }
      document.getElementById('etaInfo').textContent = '資料時間：' + new Date().toLocaleTimeString('zh-HK');
    }

    function startAutoRefresh() {
      stopAutoRefresh();
      state.auto = true;
      const btn = document.getElementById('btnAuto');
      if (btn) {
        btn.textContent = '⏸ 停止自動刷新';
        btn.classList.add('active-refresh');
      }
      fetchETA();
      state.timer = setInterval(fetchETA, 20000);
    }

    function stopAutoRefresh() {
      state.auto = false;
      if (state.timer) { clearInterval(state.timer); state.timer = null; }
      const btn = document.getElementById('btnAuto');
      if (btn) {
        btn.textContent = '▶ 自動刷新';
        btn.classList.remove('active-refresh');
      }
    }

    function toggleAuto() {
      if (state.auto) stopAutoRefresh();
      else startAutoRefresh();
    }

    function showPage(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      if (id !== 'pageEta') stopAutoRefresh();
    }
    function goSearch() {
      showPage('pageSearch');
      if (!inputVal) renderHome();
    }
    function goStops() { showPage('pageStops'); }

    // 首次進入顯示收藏／歷史
    renderHome();
  </script>
</body>
